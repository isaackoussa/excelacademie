# Site statique : aucune étape de build, on publie le dossier tel quel.
# Seule exception : la fonction qui porte l'inscription à la liste.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Le dossier des fonctions est publié avec le reste : on le rend inatteignable.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Les polices Google sont le seul appel externe de la page.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La réponse d'inscription ne doit jamais être mise en cache.
[[headers]]
  for = "/api/subscribe"
  [headers.values]
    Cache-Control = "no-store"
